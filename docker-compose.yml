# Runs the Telegram bot 24x7 on your own server (Oracle free tier etc).
# Setup: bash server-setup.sh
services:
  pdfbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      QUIET_SECONDS: "45"        # wait this long after your last file, then build one PDF
      TZ: Asia/Kolkata
    volumes:
      - ./settings.json:/app/settings.json      # /set changes survive restarts
